version: '3.8'

services:
  napcat:
    image: mlikiowa/napcat-docker
    container_name: napcat
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"
    networks:
      - my-network
    restart: always
    volumes:
      - /opt/napcat/QQ:/app/.config/QQ
      - /opt/napcat/config:/app/napcat/config


  build-bot:
    image: ghcr.io/socoldkiller/build-bot:dev
    container_name: build-bot
    restart: always
    depends_on:
      - napcat

    networks:
      - my-network
    volumes:
      - $PWD/config.yaml:/app/config.yaml

networks:
  my-network:
    driver: bridge